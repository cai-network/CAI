[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cai"
version = "0.1.0"
description = "CAI decentralized AI compute network, wallet, settlement and validator layer"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
  { name = "CAI" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "cryptography>=46",
  "dilithium-py>=1.4.0",
]

[project.optional-dependencies]
desktop = [
  "Pillow>=10",
  "pystray>=0.19",
]
test = [
  "pytest>=8",
]

[project.scripts]
cai-chain = "cai_compute_chain.cli:main"
cai-desktop = "cai_compute_chain.cai_desktop_app:main"
cai-llm-shard-conformance = "cai_compute_chain.cai_llm_shard_conformance:main"
cai-llm-shard-native-bridge = "cai_compute_chain.cai_llama_cpp_shard_native_bridge:main"
cai-llm-shard-slot-state-engine = "cai_compute_chain.cai_llama_cpp_slot_state_engine:main"
cai-slot-state-handoff-smoke = "cai_compute_chain.cai_slot_state_handoff_smoke:main"
cai-llm-shard-smoke-runner = "cai_compute_chain.cai_llama_cpp_shard_smoke_runner:main"
cai-llm-shard-http-smoke-bridge = "cai_compute_chain.cai_llama_cpp_shard_http_smoke_bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cai_compute_chain"]
