[project]
name = "cai-bench"
version = "0.1.0"
description = "Benchmarking tool for cai distributed inference"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27.0",
  "loguru>=0.7.3",
  "transformers>=5.0.0",
  "huggingface-hub>=0.33.4",
  "tiktoken>=0.12.0",
  "jinja2>=3.1.0",
  "protobuf>=5.29.0",
  "datasets>=2.0.0",
  "math-verify>=0.7.0",
  "lm-eval[api,math]>=0.4.0",
  "human-eval>=1.0.3",
  "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

